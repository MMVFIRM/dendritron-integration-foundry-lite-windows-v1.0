apiVersion: v1
kind: Secret
metadata:
  name: difoundry-secrets
  namespace: difoundry
type: Opaque
stringData:
  DIFOUNDRY_DATABASE_URL: postgresql+psycopg://difoundry:CHANGE_ME@postgres.database.svc.cluster.local:5432/difoundry
  DIFOUNDRY_TOKEN_KEY: REPLACE_WITH_32_BYTE_URLSAFE_BASE64
  DIFOUNDRY_VAULT_KEYS: '{"1":"REPLACE_WITH_DIFFERENT_32_BYTE_URLSAFE_BASE64"}'
  DIFOUNDRY_VAULT_ACTIVE_KEY_VERSION: "1"
  DIFOUNDRY_AUDIT_ANCHOR_KEY: REPLACE_WITH_THIRD_32_BYTE_URLSAFE_BASE64
  # Add only during a controlled first boot, then remove and keep bootstrap disabled.
  # DIFOUNDRY_BOOTSTRAP_TOKEN: REPLACE_WITH_ONE_TIME_RANDOM_TOKEN
