[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dendritron-integration-foundry"
version = "1.0.0"
description = "Foundry Lite Windows desktop: autonomous schema discovery and chat-driven Dendritron integration construction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MMV Firm" }]
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.21,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.29,<1",
  "SQLAlchemy>=2.0,<3",
  "argon2-cffi>=23,<26",
  "cryptography>=42,<47",
]


[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1.2,<2"]
production = ["psycopg[binary]>=3.2,<4"]
windows = ["pystray==0.19.5", "Pillow>=11,<13"]
windows-build = ["PyInstaller>=6.21,<7", "cyclonedx-bom>=6,<8"]

[project.scripts]
difoundry = "difoundry.cli:main"
difoundry-worker = "difoundry.production.worker:main"
difoundry-lite = "difoundry.lite.api:main"
difoundry-lite-desktop = "difoundry.lite.desktop:main"
difoundry-lite-benchmark = "difoundry.lite.cli:benchmark_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"difoundry" = ["static/*.html", "static/*.css", "static/*.js", "lite/static/*.html", "lite/static/*.css", "lite/static/*.js", "lite/static/*.png"]
